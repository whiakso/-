<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="color-scheme" content="dark" />
<title>TERMINAL // ACCESS</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap");

:root {
  --bg: #060505;
  --bg-panel: #0a0908;
  --bg-panel-raised: #0e0c0b;
  --line: rgba(150, 40, 40, 0.16);
  --line-faint: rgba(150, 40, 40, 0.07);
  --red-deep: #3a0b0b;
  --red-mid: #7a1a1a;
  --red-bright: #d92a2a;
  --red-hot: #ff3b3b;
  --glow: rgba(217, 42, 42, 0.28);
  --text-primary: #c9c5c1;
  --text-dim: #5f5a56;
  --text-red: #b23a3a;
  --font: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
button { font-family: inherit; }

.stage {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: hidden;
  background: var(--bg);
}
.stage__grid {
  position: absolute; inset: -10%;
  background-image: linear-gradient(var(--line-faint) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-faint) 1px, transparent 1px);
  background-size: 42px 42px;
  animation: drift 90s linear infinite;
  pointer-events: none;
  opacity: 0.55;
}
@keyframes drift { from { transform: translate3d(0,0,0);} to { transform: translate3d(-42px,-42px,0);} }
.stage__vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, transparent 0%, transparent 40%, rgba(0,0,0,0.65) 100%);
}
.stage__scanline {
  position: absolute; left: 0; right: 0; height: 140px;
  background: linear-gradient(180deg, transparent 0%, rgba(217,42,42,0.035) 45%, rgba(217,42,42,0.06) 50%, rgba(217,42,42,0.035) 55%, transparent 100%);
  pointer-events: none;
  animation: scan 11s linear infinite;
  mix-blend-mode: screen;
}
@keyframes scan { 0% { top: -20%; } 100% { top: 120%; } }
.stage__noise {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.05;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode: overlay;
}
.stage__corner { position: absolute; width: 20px; height: 20px; border-color: var(--red-mid); opacity: 0.55; }
.stage__corner--tl { top: 22px; left: 22px; border-top: 1px solid; border-left: 1px solid; }
.stage__corner--tr { top: 22px; right: 22px; border-top: 1px solid; border-right: 1px solid; }
.stage__corner--bl { bottom: 22px; left: 22px; border-bottom: 1px solid; border-left: 1px solid; }
.stage__corner--br { bottom: 22px; right: 22px; border-bottom: 1px solid; border-right: 1px solid; }
.stage__meta {
  position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
  font-size: 10px; letter-spacing: 0.18em; color: var(--text-dim); white-space: nowrap;
}

.panel {
  position: relative; z-index: 2; width: 100%; max-width: 380px;
  padding: 40px 36px 34px;
  background: linear-gradient(180deg, var(--bg-panel-raised), var(--bg-panel));
  border: 1px solid var(--line);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 30px 80px -30px rgba(0,0,0,0.9), 0 0 60px -25px var(--glow);
  animation: panelIn 0.7s var(--ease) both;
}
@keyframes panelIn { from { opacity: 0; transform: translateY(10px) scale(0.985);} to { opacity: 1; transform: translateY(0) scale(1);} }
.panel__index { font-size: 10px; letter-spacing: 0.22em; color: var(--text-dim); margin: 0 0 18px; }
.panel__title { font-size: 13px; font-weight: 500; letter-spacing: 0.24em; color: var(--text-primary); margin: 0 0 26px; }
.panel__field {
  position: relative; display: flex; align-items: center; gap: 10px;
  background: #050404; border: 1px solid var(--line); padding: 13px 14px;
  transition: border-color 0.35s var(--ease), box-shadow 0.35s var(--ease);
}
.panel__field:focus-within { border-color: var(--red-mid); box-shadow: 0 0 0 1px var(--red-deep), 0 0 24px -6px var(--glow); }
.panel__field--error { border-color: var(--red-hot); animation: shudder 0.4s var(--ease); }
@keyframes shudder { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-3px);} 75% { transform: translateX(3px);} }
.panel__input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text-red); font-family: var(--font); font-size: 15px; letter-spacing: 0.05em;
  caret-color: var(--red-hot); min-width: 0;
}
.panel__caret { width: 7px; height: 15px; background: var(--red-hot); opacity: 0.85; animation: blink 1.1s step-start infinite; flex-shrink: 0; }
@keyframes blink { 50% { opacity: 0; } }
.panel__footer { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; min-height: 20px; }
.panel__status { font-size: 10px; letter-spacing: 0.16em; color: var(--red-hot); opacity: 0; }
.panel__status--visible { opacity: 1; animation: glitchText 0.5s var(--ease); }
@keyframes glitchText { 0% { opacity: 0; transform: translateX(0);} 20% { opacity: 1; transform: translateX(-2px);} 40% { transform: translateX(2px);} 60% { transform: translateX(-1px);} 100% { transform: translateX(0);} }
.panel__button {
  appearance: none; background: transparent; border: 1px solid var(--red-mid);
  color: var(--text-primary); font-size: 11px; letter-spacing: 0.2em; padding: 9px 20px;
  cursor: pointer; transition: background 0.3s var(--ease), color 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.panel__button:hover, .panel__button:focus-visible { background: var(--red-deep); color: #f2e9e9; box-shadow: 0 0 22px -8px var(--glow); }
.panel__button:active { transform: translateY(1px); }
.panel__button:disabled { opacity: 0.35; cursor: default; box-shadow: none; }

.file-screen {
  position: relative; z-index: 2; width: 100%; max-width: 560px;
  display: flex; flex-direction: column; align-items: center;
  animation: fileIn 1s var(--ease) both;
}
@keyframes fileIn { from { opacity: 0; } to { opacity: 1; } }
.file-screen__frame {
  position: relative; width: 100%; aspect-ratio: 4 / 3;
  border: 1px solid var(--line); background: #030202; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 70px -30px var(--glow);
}
.file-screen__frame img {
  width: 100%; height: 100%; object-fit: cover; opacity: 0;
  animation: imageReveal 1.4s var(--ease) forwards; animation-delay: 0.3s;
}
@keyframes imageReveal { from { opacity: 0; filter: brightness(0.4) saturate(0); transform: scale(1.02);} to { opacity: 1; filter: brightness(1) saturate(1); transform: scale(1);} }
.file-screen__meta { width: 100%; display: flex; justify-content: space-between; margin-top: 14px; font-size: 10px; letter-spacing: 0.16em; color: var(--text-dim); }
.file-screen__meta strong { color: var(--text-red); font-weight: 500; }
.file-screen__continue { margin-top: 34px; }

.final-line {
  position: relative; z-index: 2; max-width: 480px; text-align: center;
  font-size: 17px; line-height: 1.9; color: var(--text-primary); letter-spacing: 0.01em;
  opacity: 0; animation: finalReveal 1.6s var(--ease) forwards; animation-delay: 0.2s;
  text-shadow: 0 0 18px var(--glow);
}
@keyframes finalReveal { from { opacity: 0; filter: blur(4px); transform: translateY(6px);} to { opacity: 1; filter: blur(0); transform: translateY(0);} }

@media (max-width: 480px) {
  .panel { padding: 32px 22px 28px; }
  .file-screen__meta { flex-direction: column; gap: 4px; }
}
</style>

async function sha256Hex(input) {
  const bytes = new TextEncoder().encode(input);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
}

const root = document.getElementById("root");

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

function stageWrapper(inner, meta) {
  const wrap = el("div", { class: "stage" }, [
    el("div", { class: "stage__grid" }),
    el("div", { class: "stage__scanline" }),
    el("div", { class: "stage__noise" }),
    el("div", { class: "stage__vignette" }),
    el("span", { class: "stage__corner stage__corner--tl" }),
    el("span", { class: "stage__corner stage__corner--tr" }),
    el("span", { class: "stage__corner stage__corner--bl" }),
    el("span", { class: "stage__corner stage__corner--br" }),
    inner,
  ]);
  if (meta) wrap.appendChild(el("div", { class: "stage__meta" }, meta));
  return wrap;
}

function renderPasswordScreen({ index, title, enterLabel, deniedLabel, expectedHash, meta, onSuccess }) {
  const input = el("input", {
    class: "panel__input",
    type: "text",
    inputmode: "numeric",
    autocomplete: "off",
  });
  const field = el("div", { class: "panel__field" }, [input, el("span", { class: "panel__caret" })]);
  const status = el("span", { class: "panel__status" });
  const button = el("button", { class: "panel__button", type: "submit" }, enterLabel);

  let checking = false;

  async function submit(e) {
    e.preventDefault();
    if (!input.value || checking) return;
    checking = true;
    const hash = await sha256Hex(input.value.trim());
    if (hash === expectedHash) {
      onSuccess();
      return;
    }
    checking = false;
    field.classList.add("panel__field--error");
    status.classList.add("panel__status--visible");
    status.textContent = deniedLabel;
    setTimeout(() => {
      field.classList.remove("panel__field--error");
      status.classList.remove("panel__status--visible");
      status.textContent = "";
      input.value = "";
      input.focus();
    }, 900);
  }

  const form = el("form", { class: "panel", onsubmit: submit }, [
    el("p", { class: "panel__index" }, index),
    el("p", { class: "panel__title" }, title),
    field,
    el("div", { class: "panel__footer" }, [status, button]),
  ]);

  requestAnimationFrame(() => input.focus());
  return stageWrapper(form, meta);
}

function renderImageScreen({ onDone }) {
  const frame = el("div", { class: "file-screen__frame" }, [
    el("img", { src: CONFIG.imageSrc, alt: "Secure file" }),
  ]);
  const meta = el("div", { class: "file-screen__meta" }, [
    el("span", {}, "SECURE FILE"),
    el("span", {}, "ACCESS LEVEL: RESTRICTED"),
    el("strong", {}, "STATUS: VERIFIED"),
  ]);
  const inner = el("div", { class: "file-screen" }, [frame, meta]);
  setTimeout(onDone, CONFIG.imageHoldMs);
  return stageWrapper(inner, "TRANSMISSION STABLE");
}

function renderFinalScreen() {
  const line = el("p", { class: "final-line", dir: "rtl" }, CONFIG.finalLine);
  return stageWrapper(line, "TRANSMISSION ENDED");
}

function mount(node) {
  root.innerHTML = "";
  root.appendChild(node);
}

function showStageOne() {
  mount(renderPasswordScreen({
    index: "01 / AUTHENTICATION",
    title: "NUMBER PASSWORD",
    enterLabel: "ENTER",
    deniedLabel: "ACCESS DENIED",
    expectedHash: CONFIG.stageOneHash,
    meta: "LINE ENCRYPTED — DO NOT DISCONNECT",
    onSuccess: showImageScreen,
  }));
}

function showImageScreen() {
  mount(renderImageScreen({ onDone: showFinalScreen }));
}

function showFinalScreen() {
  mount(renderFinalScreen());
}

showStageOne();
</script>
</body>
</html>
